<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Katalog jual dan beli pet dengan pengelolaan stok dan slide otomatis.">

    <title>Pet Stock Catalog</title>

    <style>
        /* =========================
           COLORS & BASE
        ========================= */

        :root {
            color-scheme: dark;

            --page: #06080c;
            --canvas: #090d14;
            --card: #101722;
            --image-area: #0c121c;

            --border: #253247;
            --border-soft: #1b2739;

            --text: #f2f6fc;
            --muted: #8191a8;
            --blue: #59a7ff;
            --blue-light: #b3d6ff;

            --token: #00ff40;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: var(--page);
            color: var(--text);

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 3px;
        }

        [hidden] {
            display: none !important;
        }

        /* =========================
           WORKSPACE
           Outside screenshot canvas
        ========================= */

        .workspace {
            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 28px;
            gap: 20px;
        }

        .toolbar,
        .slide-controls {
            width: min(100%, 1440px);

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;
        }

        .workspace-label {
            display: flex;
            align-items: center;
            gap: 10px;

            color: var(--muted);
            font-size: 12px;
            font-weight: 600;

            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .workspace-dot {
            width: 7px;
            height: 7px;
            flex-shrink: 0;

            border-radius: 50%;
            background: var(--blue);
        }

        .toolbar-note {
            color: var(--muted);
            font-size: 12px;
            text-align: right;
        }

        /* =========================
           SCREENSHOT CANVAS
           Always 16:9
        ========================= */

        .catalog {
            width: min(100%, 1440px);
            aspect-ratio: 16 / 9;
            flex-shrink: 0;

            container-type: inline-size;

            position: relative;
            overflow: hidden;

            background: var(--canvas);
            border: 1px solid var(--border-soft);
        }

        .catalog::before {
            content: "";

            position: absolute;
            z-index: 3;

            top: 0;
            left: 0;
            right: 0;

            height: 2px;

            background: var(--blue);
            pointer-events: none;
        }

        /* =========================
           GRID
           6 columns × 3 rows
           18 cards per slide
        ========================= */

        .pet-grid {
            width: 100%;
            height: 100%;

            display: grid;

            grid-template-columns: repeat(6, minmax(0, 1fr));
            grid-template-rows: repeat(3, minmax(0, 1fr));

            gap: 0.8cqw;
            padding: 1.1cqw;
        }

        /* =========================
           PET CARD
        ========================= */

        .pet-card {
            min-width: 0;
            min-height: 0;
            overflow: hidden;

            display: flex;
            flex-direction: column;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.65cqw;
        }

        .pet-visual {
            position: relative;

            flex: 1;
            min-height: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            isolation: isolate;

            background: var(--image-area);
            border-bottom: 1px solid var(--border-soft);
        }

        .pet-visual::after {
            content: "";

            position: absolute;
            z-index: -1;

            width: 60%;
            height: 1px;
            bottom: 13%;

            background: #233650;
            box-shadow: 0 0 28px 7px rgb(61 136 232 / 8%);

            pointer-events: none;
        }

        .stock-id {
            position: absolute;
            z-index: 1;

            top: 0.55cqw;
            left: 0.6cqw;

            color: #62758f;

            font-size: 0.5cqw;
            font-weight: 600;

            letter-spacing: 0.12em;
            font-variant-numeric: tabular-nums;
        }

        /* =========================
           PHOTO
        ========================= */

        .photo-placeholder {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 0.35cqw;
            padding-top: 0.6cqw;

            color: #455c79;
        }

        .photo-placeholder svg {
            width: 3.2cqw;
            height: 3.2cqw;
            flex-shrink: 0;

            stroke-width: 1;
        }

        .photo-placeholder span {
            color: #697d98;

            font-size: 0.45cqw;
            letter-spacing: 0.15em;

            text-transform: uppercase;
        }

        .pet-image {
            width: 100%;
            height: 100%;
            min-height: 0;

            display: block;

            padding: 1.25cqw 0.7cqw 0.4cqw;

            object-fit: contain;
        }

        /* =========================
           CARD INFORMATION
        ========================= */

        .pet-info {
            flex-shrink: 0;
            min-width: 0;

            padding: 0.65cqw 0.65cqw 0.6cqw;
        }

        .pet-name {
            margin: 0 0 0.45cqw;
            overflow: hidden;

            color: var(--text);

            font-size: 0.98cqw;
            line-height: 1.2;
            font-weight: 700;

            letter-spacing: -0.035em;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* =========================
           MUTATIONS
        ========================= */

        .mutation-list {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;

            gap: 0.22cqw;
        }

        .mutation {
            display: inline-flex;
            align-items: center;

            gap: 0.22cqw;

            min-height: 1.05cqw;
            max-width: 100%;

            padding: 0.18cqw 0.3cqw;

            border: 1px solid;
            border-radius: 0.22cqw;

            font-size: 0.45cqw;
            line-height: 1;
            font-weight: 700;

            letter-spacing: 0.025em;
            text-transform: uppercase;
        }

        .mutation::before {
            content: "";

            width: 0.22cqw;
            height: 0.22cqw;
            flex-shrink: 0;

            border-radius: 50%;
            background: currentColor;
        }

        .mutation--ember {
            color: #ffbd87;
            background: #2a1d19;
            border-color: #62402c;
        }

        .mutation--transcendent {
            color: #d2b8ff;
            background: #231d34;
            border-color: #51416f;
        }

        .mutation--inferno {
            color: #ff9898;
            background: #2c191f;
            border-color: #71333d;
        }

        .mutation--gigantic {
            color: #a7e4a1;
            background: #18291d;
            border-color: #395c3d;
        }

        .mutation--iridescent {
            color: #9de8f0;
            background: #16272e;
            border-color: #35606c;
        }

        .mutation--everchanted {
            color: #f2b9e7;
            background: #2b1b30;
            border-color: #68416e;
        }

        .mutation--any {
            color: #d5ddec;
            background: #222b39;
            border-color: #53627a;
        }

        /* =========================
           WEIGHT, STOCK & PRICE
        ========================= */

        .pet-bottom {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            gap: 0.3cqw;

            margin-top: 0.5cqw;
            padding-top: 0.5cqw;

            border-top: 1px solid var(--border);
        }

        .pet-stats {
            display: flex;
            gap: 0.6cqw;

            margin: 0;
        }

        .stat {
            display: flex;
            flex-direction: column;

            gap: 0.2cqw;
        }

        .stat dt {
            color: var(--muted);

            font-size: 0.43cqw;
            line-height: 1;

            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .stat dd {
            margin: 0;

            color: #dce7f7;

            font-size: 0.76cqw;
            line-height: 1.15;
            font-weight: 650;

            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .unit {
            color: var(--muted);

            font-size: 0.48cqw;
            font-weight: 500;
        }

        .price {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;

            gap: 0.25cqw;

            color: var(--blue-light);

            font-size: 1.05cqw;
            line-height: 1;
            font-weight: 750;

            letter-spacing: -0.045em;

            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .token-icon {
            width: 0.9cqw;
            height: 0.9cqw;
            flex-shrink: 0;

            color: var(--token);
        }

        /* =========================
           SOLD STATE
           Controlled by stock in app.js
        ========================= */

        .sold-label {
            display: none;
        }

        .pet-card.is-sold .pet-visual>.photo-placeholder,
        .pet-card.is-sold .pet-image {
            opacity: 0.3;
            filter: grayscale(1);
        }

        .pet-card.is-sold .pet-info {
            opacity: 0.5;
        }

        .pet-card.is-sold .sold-label {
            position: absolute;
            z-index: 2;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #f3f6fc;

            font-size: 1.45cqw;
            font-weight: 800;
            letter-spacing: 0.17em;

            background: rgb(5 9 15 / 30%);
        }

        .sold-label span {
            padding: 0.35cqw 0.65cqw;

            border-top: 2px solid #8f9db0;
            border-bottom: 2px solid #8f9db0;

            transform: rotate(-9deg);
        }

        /* =========================
           BUY CARD
           YOU → Pet
           ME  → Token offer
        ========================= */

        .buy-card .pet-visual {
            padding-top: 1.1cqw;
        }

        .trade-you {
            position: absolute;
            z-index: 1;

            top: 0.45cqw;
            left: 50%;

            transform: translateX(-50%);

            color: #b3d6ff;

            font-size: 0.65cqw;
            font-weight: 800;
            letter-spacing: 0.16em;
        }

        .buy-card .pet-image {
            padding-top: 0.3cqw;
        }

        .buy-card .mutation-list {
            max-height: 2.7cqw;
            overflow: auto;

            scrollbar-width: thin;
        }

        .buy-weight {
            margin-top: 0.4cqw;

            color: var(--muted);
            font-size: 0.56cqw;
        }

        .buy-weight span {
            color: var(--text);
            font-weight: 650;
        }

        .buy-offer {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 0.4cqw;

            margin-top: 0.45cqw;
            padding-top: 0.45cqw;

            border-top: 1px solid var(--border);
        }

        .trade-me {
            color: #a7e4a1;

            font-size: 0.65cqw;
            font-weight: 800;
            letter-spacing: 0.12em;
        }

        /* =========================
           EMPTY / LOADING STATE
        ========================= */

        .catalog-empty {
            grid-column: 1 / -1;
            grid-row: 1 / -1;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 1cqw;

            color: var(--muted);
            font-size: 1.1cqw;
            text-align: center;
        }

        .catalog-empty strong {
            color: #dce7f7;
            font-size: 2cqw;
        }

        /* =========================
           SLIDE CONTROLS
        ========================= */

        .slide-controls {
            justify-content: center;
            flex-wrap: wrap;
        }

        .slide-button {
            width: 34px;
            height: 34px;

            display: grid;
            place-items: center;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: #101722;
            color: var(--muted);

            font: inherit;
        }

        .slide-button:not(:disabled) {
            cursor: pointer;
        }

        .slide-button:not(:disabled):hover {
            color: var(--text);
            border-color: var(--blue);
        }

        .slide-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .slide-counter {
            min-width: 54px;

            color: var(--muted);
            font-size: 12px;
            text-align: center;

            font-variant-numeric: tabular-nums;
        }

        .slide-counter span {
            color: #dae7fa;
        }

        .auto-button {
            padding: 8px 10px;

            border: 1px solid #30435f;
            border-radius: 8px;

            background: #101722;
            color: #adbed5;

            font: inherit;
            font-size: 11px;

            cursor: pointer;
        }

        /* =========================
           CAPTURE MODE
        ========================= */

        body.capture-mode {
            background: var(--canvas);
        }

        body.capture-mode .workspace {
            min-height: 100vh;
            justify-content: flex-start;

            padding: 0;
            gap: 0;
        }

        body.capture-mode .toolbar,
        body.capture-mode .slide-controls,
        body.capture-mode .admin-tools,
        body.capture-mode .admin-panel {
            display: none !important;
        }

        body.capture-mode .catalog {
            width: 100%;
            max-width: none;

            border: 0;
        }

        /* =========================
           MOBILE
           Catalog remains 6 × 3
        ========================= */

        @media (max-width: 640px) {
            .workspace {
                padding: 12px;
                gap: 14px;
            }

            .workspace-label {
                font-size: 10px;
                letter-spacing: 0.08em;
            }

            .toolbar-note {
                display: none;
            }
        }

        /* =========================
           PRINT
        ========================= */

        @media print {
            @page {
                size: landscape;
                margin: 0;
            }

            body {
                background: var(--canvas);

                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .workspace {
                min-height: auto;

                padding: 0;
                gap: 0;
            }

            .toolbar,
            .slide-controls,
            .admin-tools,
            .admin-panel {
                display: none !important;
            }

            .catalog {
                width: 100%;
                max-width: none;

                border: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Reusable SVG icons -->
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"
        style="position:absolute; width:0; height:0; overflow:hidden">
        <defs>
            <!-- Generic token icon -->
            <symbol id="icon-token" viewBox="0 0 24 24">
                <path d="M12 2 21 7v10l-9 5-9-5V7Z" fill="currentColor" fill-opacity=".12" stroke="currentColor"
                    stroke-width="1.5" />

                <path d="m12 7 5 5-5 5-5-5Z" fill="none" stroke="currentColor" stroke-width="1.5" />
            </symbol>

            <!-- Photo placeholder icon -->
            <symbol id="icon-photo" viewBox="0 0 64 64">
                <rect x="9" y="9" width="46" height="46" rx="12" fill="none" stroke="currentColor" />

                <circle cx="24" cy="24" r="5" fill="none" stroke="currentColor" />

                <path d="m12 46 14-13 10 8 8-10 9 12" fill="none" stroke="currentColor" stroke-linecap="round"
                    stroke-linejoin="round" />
            </symbol>
        </defs>
    </svg>

    <main class="workspace">
        <!-- Outside screenshot canvas -->
        <header class="toolbar">
            <div class="workspace-label">
                <span class="workspace-dot"></span>
                Selling Pet Catalog
            </div>

            <div class="toolbar-note">
                16:9 canvas · 18 pets per slide · auto 8s
            </div>
        </header>

        <!--
            app.js inserts:
            - Jual Pet / Beli Pet navigation
            - Manage stock / Manage wanted pets button
            - Screenshot mode button
            before this catalog.
        -->

        <!-- Screenshot / live canvas -->
        <section class="catalog" aria-label="Pet stock catalog">
            <div class="pet-grid">
                <!-- Replaced by app.js after loading browser data -->
                <div class="catalog-empty">
                    <strong>Loading catalog...</strong>
                    <span>Memuat data pet dari browser.</span>
                </div>
            </div>
        </section>

        <!-- Replaced and controlled by app.js -->
        <nav class="slide-controls" aria-label="Catalog slides">
            <button class="slide-button" type="button" data-page="previous" aria-label="Previous slide" disabled>
                &#8592;
            </button>

            <div class="slide-counter">
                <span>01</span> / 01
            </div>

            <button class="slide-button" type="button" data-page="next" aria-label="Next slide" disabled>
                &#8594;
            </button>
        </nav>

        <!-- app.js appends the management panel here -->
        <noscript>
            <p>
                Aktifkan JavaScript untuk menggunakan katalog dan
                pengelolaan pet.
            </p>
        </noscript>
    </main>

    <script src="app.js"></script>
</body>

</html>
